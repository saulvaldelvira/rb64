[package]
name = "rb64"
description = "Base 64"
version = "0.2.1"
edition = "2021"
authors = ["Saúl Valdelvira <saul@saulv.es>"]
license = "MIT"
readme = "README"

[lib]
crate-type = [ "lib", "cdylib", "staticlib" ]

[dependencies]
fltk = { version = "1.4", optional = true }

[build-dependencies]
cbindgen = { version = "0.24.0", optional = true }

[features]
default = []
no-std = []
bindings = ["dep:cbindgen"]
gui = ["dep:fltk"]
use-bundled-fltk = ["fltk/fltk-bundled"]

